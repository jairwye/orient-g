# Gitea 栈（HTTP 内网模式）
# 与 Orient-G 业务栈完全隔离：独立 PG、独立 volume
# 部署到生产机：
#   docker compose -f docker-compose.gitea.yml --env-file .env up -d
#
# 端口与口令一律由环境变量注入，勿在仓库写死内网 IP/真实口令。
# 必填示例见同目录 README.md

services:
  gitea:
    image: gitea/gitea:1.23
    container_name: gitea
    restart: unless-stopped
    ports:
      - "${GITEA_SSH_HOST_PORT:?set GITEA_SSH_HOST_PORT}:22"   # SSH（开发者 push）
      - "${GITEA_HTTP_HOST_PORT:?set GITEA_HTTP_HOST_PORT}:3000" # HTTP Web + Registry
    volumes:
      - gitea-data:/data/gitea
      - ./app.ini:/etc/gitea/app.ini:ro
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: gitea-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gitea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gitea}
    volumes:
      - gitea-pgdata:/var/lib/postgresql/data

  runner:
    image: gitea/act_runner:latest
    container_name: gitea-act-runner
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gitea-runner-data:/data/gitea-runner
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN:?set runner token}
      GITEA_RUNNER_NAME: ${GITEA_RUNNER_NAME:-orient-g-runner}
      GITEA_RUNNER_LABELS: ubuntu-latest:docker://node:20-bookworm

volumes:
  gitea-data:
  gitea-pgdata:
  gitea-runner-data:
