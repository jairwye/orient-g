# Orient-G（财务信息内网）- 生产环境仅内网部署
# 使用方式：在 Portainer 中上传本文件并配置环境变量；更新镜像建议按服务 pull（见 README），勿对仅本地构建的 docling 执行 pull
# backend/frontend 镜像来自 ghcr.io，可在 .env 中设置 BACKEND_IMAGE、FRONTEND_IMAGE 覆盖
# 反向代理与业务服务应只绑定内网 IP（见规划文档第三节）

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mgmt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-mgmt_web}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # 健康检查：确认 PostgreSQL 已就绪，backend 的 depends_on 会等此通过后再启动
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mgmt}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Docling 侧车：本地 build 版本（当前生产使用）
  # 切换方式：在 .env 中设置 DOCLING_IMAGE=orientg-docling-sidecar:temp
  # =============================================================================
  # docling:
  #   image: ${DOCLING_IMAGE:-orientg-docling-sidecar:local}
  #   pull_policy: never
  #   cpus: ${DOCLING_CPUS:-2.0}
  #   mem_limit: ${DOCLING_MEM_LIMIT:-4g}
  #   build:
  #     context: docker/docling-sidecar
  #     dockerfile: Dockerfile
  #     args:
  #       DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
  #       PIP_INDEX_URL: ${PIP_INDEX_URL:-}
  #       PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
  #       SKIP_MODEL_DOWNLOAD: ${SKIP_MODEL_DOWNLOAD:-1}
  #   ports:
  #     - "${BIND_IP:-127.0.0.1}:8080:8080"
  #   environment:
  #     DOCLING_ARTIFACTS_PATH: ${DOCLING_ARTIFACTS_PATH:-/models/docling-artifacts}
  #     DOCLING_CLI_TIMEOUT_S: ${DOCLING_CLI_TIMEOUT_S:-3600}
  #   volumes:
  #     - ./docling-artifacts:${DOCLING_ARTIFACTS_PATH:-/models/docling-artifacts}
  #   restart: unless-stopped

  # =============================================================================
  # Docling 侧车：官方 docling-serve 镜像（备选，用于对比测试或替换本地 build）
  # 切换方式：在 .env 中设置 DOCLING_IMAGE=quay.io/docling-project/docling-serve:latest
  #         并移除本地上下文的 build 段落，保留 image + pull_policy
  # 官方镜像端口：容器内 5001，compose 通过 "8080:5001" 映射与 backend 的 :8080 对齐
  # 官方镜像默认已包含模型，无需 huggingface 缓存卷
  # =============================================================================
  docling:
    image: ${DOCLING_IMAGE:-quay.io/docling-project/docling-serve:latest}
    pull_policy: if_not_present
    cpus: ${DOCLING_CPUS:-2.0}
    mem_limit: ${DOCLING_MEM_LIMIT:-4g}
    ports:
      - "${BIND_IP:-127.0.0.1}:8080:5001"
    environment:
      # 代理（官方镜像拉取/运行时下载模型可能需要）
      HTTP_PROXY: ${HTTP_PROXY:-http://192.168.104.108:7890}
      HTTPS_PROXY: ${HTTPS_PROXY:-http://192.168.104.108:7890}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      # 官方镜像默认走 HTTP 模式
      DOCLING_MODE: http
      # 大 PDF / 扫描件建议超时 >= 3600s
      DOCLING_CLI_TIMEOUT_S: ${DOCLING_CLI_TIMEOUT_S:-3600}
    volumes:
      - ./docling-artifacts:${DOCLING_ARTIFACTS_PATH:-/models/docling-artifacts}
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/jairwye/orient-g-backend:latest}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mgmt}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-mgmt_web}
      UPLOAD_DIR: /app/uploads
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-orient-g-auth-secret-change-in-production}
      DOCLING_MODE: ${DOCLING_MODE:-http}
      DOCLING_HTTP_BASE_URL: ${DOCLING_HTTP_BASE_URL:-http://docling:8080}
      DOCLING_HTTP_TIMEOUT_S: ${DOCLING_HTTP_TIMEOUT_S:-3600}
      DOCLING_HTTP_CONNECT_TIMEOUT_S: ${DOCLING_HTTP_CONNECT_TIMEOUT_S:-10}
      DOCLING_HTTP_READ_TIMEOUT_S: ${DOCLING_HTTP_READ_TIMEOUT_S:-5400}
      DOCLING_HTTP_WRITE_TIMEOUT_S: ${DOCLING_HTTP_WRITE_TIMEOUT_S:-60}
      QUEUE_WORKER_LEASE_SECONDS: ${QUEUE_WORKER_LEASE_SECONDS:-3600}
      QUEUE_WORKER_HEARTBEAT_SECONDS: ${QUEUE_WORKER_HEARTBEAT_SECONDS:-60}
      QUEUE_RUNNING_TIMEOUT_SECONDS: ${QUEUE_RUNNING_TIMEOUT_SECONDS:-7200}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db: { condition: service_healthy }
      docling:
        condition: service_started
    restart: unless-stopped
    # 健康检查：容器内请求本机 /api/health，返回 2xx 则视为健康；供编排/监控判断 backend 是否可用（不依赖 GPU/Ollama）
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5); exit(0 if 200<=r.getcode()<300 else 1)\" || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/jairwye/orient-g-frontend:latest}
    environment:
      API_URL: http://backend:8000
      API_BASE_SERVER: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  # Ollama（可选）：主要用于知识库 embeddings（CPU，不申请 GPU；移除 Oculink/eGPU 后仍可在同机跑嵌入）
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    # 资源上限：嵌入/小模型 CPU 推理可能占用较多内存；建议生产先给上限，避免 OOM 拖死宿主机
    cpus: ${OLLAMA_CPUS:-6.0}
    mem_limit: ${OLLAMA_MEM_LIMIT:-12g}
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_NUM_GPU=0

  # 反向代理：生产环境应只监听内网 IP（在部署时通过 Portainer 或 compose 覆盖）
  caddy:
    image: caddy:2-alpine
    environment:
      # 域名访问时用：CADDY_DOMAIN=你的域名，CADDY_BACKEND_HOST=服务器 IP（与 BIND_IP 一致），避免 502；不设则用默认
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
      CADDY_BACKEND_HOST: ${CADDY_BACKEND_HOST:-127.0.0.1}
    ports:
      - "${BIND_IP:-127.0.0.1}:443:443"
      - "${BIND_IP:-127.0.0.1}:80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped
    # 注意：Caddy 不配置 healthcheck，原因：
    # 1. caddy:2-alpine 镜像的 healthcheck 命令曾多次导致 SIGALRM 杀死 Caddy 进程
    # 2. restart: unless-stopped + depends_on: backend: service_healthy 已足够保障
    # 3. 生产环境可通过 /api/health 间接监控 Caddy 状态

volumes:
  pgdata: {}
  uploads_data: {}
  caddy_data: {}
  ollama_data: {}