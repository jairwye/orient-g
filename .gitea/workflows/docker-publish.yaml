# 构建 backend / frontend 并推送到内网 Gitea Registry。
# 路径 B：不拉取 GitHub Actions；基础镜像经国内 Docker Hub 镜像站拉取（避免 auth.docker.io 超时）。
name: Build and push Docker images

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: 192.168.104.108:3090
  OWNER: u1
  # 与 Dockerfile FROM 对齐
  BASE_BACKEND: python:3.12-slim
  BASE_FRONTEND: node:22-alpine
  # Docker Hub 代理镜像（library/*）；不可用时可改成其它加速站
  HUB_MIRROR: docker.m.daocloud.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout from Gitea
        run: |
          git config --global http.sslVerify false
          git clone "http://${{ github.actor }}:${{ secrets.REGISTRY_TOKEN }}@192.168.104.108:3090/${{ github.repository }}.git" .

      # job 镜像若已有 docker 则跳过；否则用清华源安装
      - name: Ensure Docker CLI
        run: |
          set -e
          if command -v docker >/dev/null 2>&1; then
            echo "Docker CLI already present:"
            docker version
            exit 0
          fi
          echo "Docker CLI missing; installing via Tsinghua Debian mirror..."
          if [ -f /etc/apt/sources.list.d/debian.sources ]; then
            sed -i 's|deb.debian.org|mirrors.tuna.tsinghua.edu.cn|g; s|security.debian.org|mirrors.tuna.tsinghua.edu.cn|g' \
              /etc/apt/sources.list.d/debian.sources
          elif [ -f /etc/apt/sources.list ]; then
            sed -i 's|deb.debian.org|mirrors.tuna.tsinghua.edu.cn|g; s|security.debian.org|mirrors.tuna.tsinghua.edu.cn|g' \
              /etc/apt/sources.list
          fi
          apt-get update
          apt-get install -y docker.io
          ln -sf /usr/bin/docker /usr/local/bin/docker
          docker version

      - name: Log in to Gitea Registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin

      - name: Pull base images (Hub mirror, then retag)
        run: |
          set -e
          pull_base() {
            local name="$1"
            local mirror_ref="${{ env.HUB_MIRROR }}/library/${name}"
            if docker image inspect "${name}" >/dev/null 2>&1; then
              echo "Local image already present: ${name} (skip pull)"
              return 0
            fi
            echo "Pulling ${mirror_ref} ..."
            docker pull "${mirror_ref}"
            docker tag "${mirror_ref}" "${name}"
            echo "Tagged as ${name}"
          }
          pull_base "${{ env.BASE_BACKEND }}"
          pull_base "${{ env.BASE_FRONTEND }}"
          docker images | grep -E 'python|node' || true

      - name: Extract short SHA
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # 不用 --pull：避免构建时再打 auth.docker.io（本地已有基础镜像即可）
      - name: Build and push backend
        run: |
          set -e
          IMG="${{ env.REGISTRY }}/${{ env.OWNER }}/orient-g-backend"
          docker build \
            -t "${IMG}:latest" \
            -t "${IMG}:sha-${{ steps.meta.outputs.sha }}" \
            -f backend/Dockerfile .
          docker push "${IMG}:latest"
          docker push "${IMG}:sha-${{ steps.meta.outputs.sha }}"

      - name: Build and push frontend
        run: |
          set -e
          IMG="${{ env.REGISTRY }}/${{ env.OWNER }}/orient-g-frontend"
          docker build \
            -t "${IMG}:latest" \
            -t "${IMG}:sha-${{ steps.meta.outputs.sha }}" \
            -f frontend/Dockerfile .
          docker push "${IMG}:latest"
          docker push "${IMG}:sha-${{ steps.meta.outputs.sha }}"
