# 构建 backend / frontend 镜像并推送到内网 Gitea Registry
name: Build and push Docker images

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: 192.168.104.108:3090
  OWNER: u1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git config --global http.sslVerify false
          git clone https://${{ github.actor }}:${{ secrets.REGISTRY_TOKEN }}@192.168.104.108:3090/${{ github.repository }}.git .

      - name: Log in to Gitea Registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Extract short SHA
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push backend
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.OWNER }}/orient-g-backend:latest             -t ${{ env.REGISTRY }}/${{ env.OWNER }}/orient-g-backend:sha-${{ steps.meta.outputs.sha }}             -f backend/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.OWNER }}/orient-g-backend:latest
          docker push ${{ env.REGISTRY }}/${{ env.OWNER }}/orient-g-backend:sha-${{ steps.meta.outputs.sha }}

      - name: Build and push frontend
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.OWNER }}/orient-g-frontend:latest             -t ${{ env.REGISTRY }}/${{ env.OWNER }}/orient-g-frontend:sha-${{ steps.meta.outputs.sha }}             -f frontend/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.OWNER }}/orient-g-frontend:latest
          docker push ${{ env.REGISTRY }}/${{ env.OWNER }}/orient-g-frontend:sha-${{ steps.meta.outputs.sha }}
