# 构建 backend / frontend 镜像并推送到内网 Gitea Registry
# 使用 Gitea Actions 原生格式，保留 docker/login-action 和 setup-buildx-action
# 服务器上使用 docker compose pull && docker compose up -d 拉取镜像运行

name: Build and push Docker images

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: 192.168.104.108:3090
  OWNER: u1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 单平台 amd64 构建用 driver:docker，走 runner 自带 BuildKit，不依赖 Docker Hub。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      # Gitea Actions 没有内置 Docker 登录，需显式 login 到内网 registry
      - name: Log in to Gitea Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/orient-g-backend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/orient-g-backend:sha-${{ steps.meta.outputs.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/orient-g-frontend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/orient-g-frontend:sha-${{ steps.meta.outputs.sha }}
