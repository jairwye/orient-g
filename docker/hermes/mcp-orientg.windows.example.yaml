# Windows 本机 Hermes → Orient-G MCP（见 docs/hermes.md §2）
# 合并进 %USERPROFILE%\.hermes\config.yaml 顶层
#
# 前置：
#   1. Orient-G 本机 .venv 已安装 backend 依赖（含 mcp）
#   2. 项目根 .env：DATABASE_URL 指向本机开发库（见 .env.example）
#   3. %USERPROFILE%\.hermes\.env：Gateway 见 dotenv.hermes.gateway.example
#      /agent 路径不必写 ORIENTG_USER_TOKEN；仅 hermes chat 单人调试见 dotenv.hermes.orientg.example
#   4. MCP 子进程 cwd 为项目根，backend/config.py 会读该目录 .env
#
# 工具名在 Hermes 中为：mcp_orientg_orientg_kb_ask 等

mcp_servers:
  orientg:
    command: "%USERPROFILE%/Projects/orient-g/.venv/Scripts/python.exe"
    args:
      - "-m"
      - "backend.mcp.orientg_server"
    cwd: "%USERPROFILE%/Projects/orient-g"
    env:
      PYTHONPATH: "%USERPROFILE%/Projects/orient-g"
      ORIENTG_INTERNAL_BASE_URL: "http://127.0.0.1:8000"
      ORIENTG_MCP_BRIDGE_SECRET: "${ORIENTG_MCP_BRIDGE_SECRET}"
      ORIENTG_USER_TOKEN: "${ORIENTG_USER_TOKEN}"
    timeout: 180
    connect_timeout: 60

# Hermes 官方 tool_loop_guardrails 默认仅 warn，模型可空转至 max_iterations（见
# NousResearch/hermes-agent issue #25823）。Orient-G Tier2 人员/KB 任务建议开启 hard_stop：
#
# tool_loop_guardrails:
#   warnings_enabled: true
#   hard_stop_enabled: true
#   hard_stop_after:
#     exact_failure: 5
#     same_tool_failure: 6
#     idempotent_no_progress: 4
